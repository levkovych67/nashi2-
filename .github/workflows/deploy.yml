# Manual deploy: Actions → Deploy → Run workflow → staging | production (infra/DEPLOY.md, section "Пайплайн").
# Builds the backend and web images for the chosen commit, publishes them to GHCR, then over SSH checks out that commit
# on the server and runs infra/scripts/deploy.sh <sha> (health wait, rollback to the last good tag).
# Each GitHub environment (staging, production) holds its own secrets and variables.
name: Deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging
permissions:
  contents: read
  packages: write
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image prefix (GHCR names are lowercase)
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nashi-v2" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/backend.Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      # One web image serves every environment: it calls the API at the relative /api/v2 and bakes in no domain
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/web.Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: images
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - name: Deploy over SSH
        shell: bash
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/nashi-v2' }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          install -dm 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "set -e; cd '$DEPLOY_DIR'; git fetch --quiet origin '$SHA'; git checkout --quiet --detach '$SHA'; infra/scripts/deploy.sh '$SHA'"

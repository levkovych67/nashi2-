# Production pipeline (infra/DEPLOY.md, section "Пайплайн"): every push to main that touches the product runs the
# backend and web checks; when they pass and the repository variable DEPLOY_ENABLED is "true", it builds the backend
# and web images, publishes them to GHCR, and over SSH checks out that commit on the server and runs
# infra/scripts/deploy.sh <sha> (health wait, rollback to the last good tag). Run it by hand to redeploy.
name: Deploy
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'web/**'
      - 'contracts/**'
      - 'infra/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
      - '!**/*.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # Testcontainers starts Mongo and MinIO in the runner's Docker
      - run: ./gradlew test --no-daemon
        working-directory: backend

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -w contracts
      - run: npm run typecheck -w web
      - run: npm test -w web
      - run: npm run test:scripts -w web
      - run: npm run build -w web
      - run: npm run check:bundle -w web

  images:
    needs: [backend, web]
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image prefix (GHCR names are lowercase)
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nashi-v2" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/backend.Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      # The web image calls the API at the relative /api/v2 and bakes in no domain
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/web.Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: images
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Deploy over SSH
        shell: bash
        env:
          # DEPLOY_HOST: user@host (or a bare host, then vars.DEPLOY_USER, default deploy)
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/nashi-v2' }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          install -dm 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          target="$SSH_HOST"
          [[ "$target" == *@* ]] || target="$SSH_USER@$target"
          ssh -i ~/.ssh/deploy -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$target" \
            "set -e; cd '$DEPLOY_DIR'; git fetch --quiet origin '$SHA'; git checkout --quiet --detach '$SHA'; infra/scripts/deploy.sh '$SHA'"

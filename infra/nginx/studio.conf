# Include in an HTTPS server for the private studio hostname.
root /var/www/nashi-studio;
index index.html;
auth_basic "Nashi studio";
auth_basic_user_file /etc/nginx/nashi-studio.htpasswd;
add_header X-Robots-Tag "noindex, nofollow" always;
gzip on;
gzip_types application/json application/geo+json application/javascript text/css image/svg+xml;

location /assets/ {
    expires 1y;
    try_files $uri =404;
}
location ~ ^/(fixtures|geo|lviv)/ {
    try_files $uri =404;
}
location / {
    try_files $uri /index.html;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 60m;

    # Compress text: JS, CSS, the API's JSON (map pins are ~0.5 MB raw), the region GeoJSON, SVG. HTML always is.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    # also for requests that come through an edge proxy (Via header), e.g. the host nginx in front
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json application/problem+json
               application/geo+json image/svg+xml text/plain;

    # Hashed build output: cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Region geometry, fetched at runtime; not hashed, so revalidate (ETag). nginx's mime.types has no .geojson, and
    # a types block replaces the inherited map, hence this location's own.
    location /geo/ {
        types {
            application/geo+json geojson;
            application/json json;
        }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Append $remote_addr to any X-Forwarded-For. The backend (Tomcat RemoteIpValve, forward-headers-strategy
        # native) takes the RIGHTMOST hop that is not an internal proxy (private/loopback ranges), so values a client
        # sends ahead of it never choose its rate-limit IP, and an edge proxy in front (host nginx on the Docker
        # network) is skipped as internal. A CDN with public addresses in front would need its ranges added to
        # server.tomcat.remoteip.trusted-proxies.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # RFC 7239 Forwarded is client-controlled here; drop it so nothing downstream can read it
        proxy_set_header Forwarded "";
    }

    # The SPA shell must never be cached stale: after a deploy it names the new hashed chunks.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Every route of the SPA is index.html (try_files hands it to the location above, with its no-cache).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

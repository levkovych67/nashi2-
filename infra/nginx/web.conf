server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 60m;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Append $remote_addr to any X-Forwarded-For. The backend (Tomcat RemoteIpValve, forward-headers-strategy
        # native) takes the RIGHTMOST hop that is not an internal proxy (private/loopback ranges), so values a client
        # sends ahead of it never choose its rate-limit IP, and an edge proxy in front (host nginx on the Docker
        # network) is skipped as internal. A CDN with public addresses in front would need its ranges added to
        # server.tomcat.remoteip.trusted-proxies.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # RFC 7239 Forwarded is client-controlled here; drop it so nothing downstream can read it
        proxy_set_header Forwarded "";
    }

    location / {
        try_files $uri /index.html;
    }
}

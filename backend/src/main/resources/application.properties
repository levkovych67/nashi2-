spring.application.name=nashi-backend
server.port=8080

# Secrets never live in this repo. Production reads them from the file below (override with NASHI_SECRETS_FILE):
#   spring.mongodb.uri, nashi.s3.bucket, nashi.s3.access-key-id, nashi.s3.secret-access-key, nashi.s3.region,
#   nashi.s3.public-base-url, nashi.telegram.bot-token, nashi.telegram.moderation.chat-id,
#   nashi.security.ip-hash-secret, nashi.cors.allowed-origins, nashi.site-base-url.
# Local runs use SPRING_PROFILES_ACTIVE=local (application-local.properties) instead; tests use the test profile.
# StartupConfigGuard stops the app when a key is missing or a local/test profile points at a live service.
spring.config.import=optional:file:${NASHI_SECRETS_FILE:/etc/nashi-v2/backend.properties}

# Behind nginx: client IP, scheme and host come from X-Forwarded-* (rate limits key on the client IP)
server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json,text/plain

# One photo may be up to 12 MB on the wire so the validator, not Tomcat, rejects photos over 10 MB with a field
# error (images[i]); anything over the request limit is 413 PAYLOAD_TOO_LARGE.
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=55MB

# OpenAPI: off in production, on in the local and test profiles
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# @Scheduled jobs; the test profile turns them off
nashi.scheduling.enabled=true

# How long the Mongo driver waits for a reachable server (the driver default; a failover can take several seconds)
nashi.mongo.server-selection-timeout=30s

# Telegram is on in production only; local and test must set both to false (StartupConfigGuard checks)
nashi.telegram.polling-enabled=true
nashi.telegram.sending-enabled=true

# Outgoing HTTP clients identify the project without personal details (plan Global Constraints, D-52);
# production sets its own domain here once it is known
nashi.http.user-agent=NashiBot/2.0 (+https://nashi.example/about)
# Pause between two Wikimedia requests (at least 1 s; requests are sequential and honour Retry-After)
nashi.wiki.request-gap=1s

# Load geo/places-ua.json.gz into `places` on startup when its version (geo/places-ua.version) changed
nashi.places.seed.enabled=true

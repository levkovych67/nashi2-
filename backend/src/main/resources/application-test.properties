# Test profile: the same rules as local (StartupConfigGuard). The guard runs before @DynamicPropertySource,
# so these static values must be safe; MongoIT then points Mongo and S3 at its Testcontainers.
spring.mongodb.uri=mongodb://localhost:27017/nashi_v2

nashi.s3.endpoint=http://localhost:9000
nashi.s3.region=us-east-1
nashi.s3.bucket=nashi-v2
nashi.s3.access-key-id=minioadmin
nashi.s3.secret-access-key=minioadmin
nashi.s3.path-style-access=true
nashi.s3.public-base-url=http://localhost:9000/nashi-v2

nashi.telegram.polling-enabled=false
nashi.telegram.sending-enabled=false
nashi.telegram.bot-token=test-disabled
nashi.telegram.moderation.chat-id=0

nashi.security.ip-hash-secret=test-only-not-a-secret
nashi.cors.allowed-origins=http://localhost:5173
nashi.site-base-url=http://localhost:5173

# Scheduled jobs would fire in the middle of integration tests
nashi.scheduling.enabled=false
# Tests never reach Wikimedia: no Wikipedia import and no enrichment of approved submissions
nashi.wiki-import.enabled=false
nashi.wiki.enrichment.enabled=false

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Tests stop the server at JVM exit; graceful shutdown would only add log lines after the last test
server.shutdown=immediate

# Fail fast when Mongo is down so /api/v2/health answers promptly
nashi.mongo.server-selection-timeout=3s

# The places seed (25k+ rows) would land in the database every IT shares; PlaceSeederIT runs its own instance
nashi.places.seed.enabled=false

# All preview sources on (tests stub the providers and never call the live APIs)
nashi.audio.providers.deezer.enabled=true
nashi.audio.providers.itunes.enabled=true
nashi.audio.providers.commons.enabled=true

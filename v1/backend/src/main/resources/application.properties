server.port=8080

# Secrets never live in this repo. Production reads them from the file below (override with NASHI_SECRETS_FILE):
# spring.data.mongodb.uri, spring.ai.openai.api-key, aws.s3.access-key-id, aws.s3.secret-access-key,
# telegram.bot-token, telegram.admin-chat-id, telegram.channel-id.
# Local runs use SPRING_PROFILES_ACTIVE=local (application-local.properties) instead.
# StartupConfigGuard stops the app when a key is missing or the local profile points at a live service.
spring.config.import=optional:file:${NASHI_SECRETS_FILE:/etc/nashi/nashi-backend.properties}

# CORS: comma-separated allowed origins
nashi.cors.allowed-origins=*

server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/plain,application/javascript,text/css
server.compression.min-response-size=2048

# OpenAPI / Swagger UI
# Swagger UI will be available at: http://localhost:${server.port}/swagger-ui
# OpenAPI JSON will be available at: http://localhost:${server.port}/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/v3/api-docs

# Sort operations/tags a bit nicer in the UI
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# Only scan our API package (keeps the spec clean if more beans/controllers appear)
springdoc.packagesToScan=com.nashi.controller

aws.s3.region=eu-north-1
aws.s3.bucket=nashi-music-storage-2025

spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.max-file-size=100MB

# Telegram: false turns every outgoing message into a logged no-op
telegram.enabled=true

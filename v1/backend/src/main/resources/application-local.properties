# Local profile (SPRING_PROFILES_ACTIVE=local): no live database, bot, S3 or OpenAI.
# StartupConfigGuard refuses to start this profile with a remote MongoDB, Telegram on or real keys.
spring.data.mongodb.uri=mongodb://localhost:27017/nashi

# Telegram: no outgoing messages, and the starter does not long-poll (that would steal production updates)
telegram.enabled=false
telegrambots.enabled=false
telegram.bot-token=local-disabled
telegram.admin-chat-id=0
telegram.channel-id=0

spring.ai.openai.api-key=local-disabled

aws.s3.access-key-id=local-disabled
aws.s3.secret-access-key=local-disabled

nashi.wiki-import.enabled=false
# Seed an empty local database from Wikipedia at startup (LocalSeedRunner), at most N candidates per group.
nashi.wiki-import.on-startup=true
nashi.wiki-import.limit-per-category=150
